baseURL: "https://coldburgundy.github.io/"
title: "Draktharr Lab"
# CLI 는 hugo-theme-terminalcv(MIT, coolapso)를 바탕으로 재작성했습니다. 테마 레이아웃은 모두 이 저장소에 있으므로 테마 의존성은 없습니다.

# 한국어 사이트 설정
languageCode: "ko-KR"
defaultContentLanguage: "ko"
hasCJKLanguage: true     # 한글 글자 수/읽기 시간 계산
timeZone: "Asia/Seoul"   # 날짜만 적은 글이 KST 자정 기준으로 발행되도록
summaryLength: 40
capitalizeListTitles: false   # 태그 이름을 적은 그대로 표시 (BOJ, DP …)
enableRobotsTXT: true

# 카테고리는 content/posts/ 아래 폴더 구조로 표현하므로 태그만 사용합니다.
taxonomies:
  tag: tags

pagination:
  pagerSize: 8

outputs:
  home: ["HTML", "RSS", "JSON"]   # JSON = /index.json (CLI 파일 트리 + GUI 검색 인덱스)
  section: ["HTML", "RSS"]
  page: ["HTML"]

params:
  description: "공부한 것과 좋아하는 것을 적어 두는 개인 기록이다."
  mainSections: ["posts"]

  author:
    name: "ColdBurgundy"
    bio: "Just student"
    email: ""                         # 공개할 연락처가 생기면 적으세요. 비어 있으면 메일 링크를 표시하지 않습니다.
    github: "https://github.com/ColdBurgundy"
    cv: ""                            # static/ 에 PDF를 넣고 "/my-cv.pdf" 처럼 적으면 CLI about 에 링크가 나타납니다.

  # ---------------------------------------------------------------
  # CLI 모드 ( / )
  # ---------------------------------------------------------------
  prompt:
    core:
      text: "user@DraktharrLab"
      color: "pink"
      before: "["
      beforeColor: "red"
      after: "]"
      afterColor: "red"
    separator:
      text: "-"
      color: "grey"
    path:
      before: "["
      beforeColor: "red"
      color: "#6ea8ff"
      after: "]"
      afterColor: "red"
    extra:
      text: ": "
      color: "orange"

  useLess: false
  # exitLocation: "https://example.com"
  exitMessage: "[Session completed, the browser window can be safely closed]"

  # 첫 줄이 공백으로 시작하면 YAML이 들여쓰기로 인식하므로, 첫 줄은 공백 없이 시작해야 합니다.
  greeting: |
    ________                __      __  .__                          .____          ___.
