  # ---------------------------------------------------------------
  # GUI 모드 ( /posts/ )
  # ---------------------------------------------------------------
  gui:
    # Formula1 Display 글꼴 (선택): true 로 바꾸면 이 컴퓨터에 "설치된" Formula1 Display 글꼴
    # (Regular / Bold / Black / Italic / Wide)을 local() 로 찾아 씁니다. 글꼴 파일은 저장소에 넣지도, 배포하지도 않습니다.
    # 그래서 글꼴이 설치된 컴퓨터에서만 F1 글꼴로 보이고, 다른 방문자에게는 기본 글꼴이 보입니다.
    # (F1 공식 글꼴은 Formula One 의 저작물이라 글꼴 파일을 static/ 등에 올려 배포하지 마세요.)
    # false 면 무료 글꼴(Saira · Michroma · Chakra Petch · DSEG7)만 씁니다.
    formula1Font: false
    heroBadge: ""              # 히어로 위 작은 문구 (비우면 표시하지 않음)
    heroTitle: "Hello World!"
    heroPrefix: "Notes on"
    heroWords: ["C++", "Algorithms", "Operating Systems", "CS:APP", "Problem Solving"]
    heroSubtitle: "지금도 써 내려가고 있는 이야기의 제목을 정하기엔 아직 이르다."
    welcomeTitle: "나중의 나를 위해 남기는 기록이다"
    welcomeText: "알고리즘, 운영체제, 시스템 프로그래밍을 공부하며 정리한 것과 논문, 구현, 그리고 영화와 모터스포츠, 한 달의 끝을 적는다. 터미널로 보려면 오른쪽 위 Terminal 버튼을 누른다."

markup:
  highlight:
    noClasses: false          # 색은 CSS(GUI: 다크 텔레메트리 / Mac 창: 1-bit 흑백)에서 지정
    lineNos: true
    lineNumbersInTable: false
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true            # 본문에 HTML을 직접 쓸 수 있도록 허용 (KaTeX와는 무관)
    extensions:
      typographer:            # 한국어 조사 앞 따옴표 짝 깨짐, 본문 속 코드의 -- << >> 변환을 막기 위해 끔
        disable: true
      passthrough:            # $...$ / $$...$$ 안의 *, _ 를 Markdown이 건드리지 않게 보존 → KaTeX가 렌더
        enable: true
        delimiters:
          block: [["$$", "$$"], ["\\[", "\\]"]]
          inline: [["$", "$"], ["\\(", "\\)"]]
  tableOfContents:
    startLevel: 2
    endLevel: 4
