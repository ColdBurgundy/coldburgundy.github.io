     │    │  ╲_  __ ╲__  ╲ │  │╱ ╱╲   __╲  │  ╲╲__  ╲╲_  __ ╲_  __ ╲ │    │   ╲__  ╲ │ __ ╲
     │    `   ╲  │ ╲╱╱ __ ╲│    <  │  │ │   Y  ╲╱ __ ╲│  │ ╲╱│  │ ╲╱ │    │___ ╱ __ ╲│ ╲_╲ ╲
    ╱_______  ╱__│  (____  ╱__│_ ╲ │__│ │___│  (____  ╱__│   │__│    │_______ (____  ╱___  ╱
            ╲╱           ╲╱     ╲╱           ╲╱     ╲╱                       ╲╱    ╲╱    ╲╱


    Draktharr Lab — 제목을 정하기엔 아직 이르다.

    Type 'help' for a list of available commands
    Type 'gui' to switch to the graphical blog

